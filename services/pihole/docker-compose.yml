services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"

    environment:
      TZ: Europe/Berlin
      WEBPASSWORD: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_listeningMode: all

    volumes:
      - ./data/etc-pihole:/etc/pihole

    restart: unless-stopped
